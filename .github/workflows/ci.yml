# Typecheck and self-checks on every push and pull request.
#
# release.yml was the only workflow, and it runs `tsc` as part of the frontend build at
# tag time — so a type error could sit on main until someone cut a version. This is the gate
# that was missing, kept deliberately cheap: no Rust toolchain, no bundling, no artifacts.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repo. A compromised dependency gets a token that
# can only read.
permissions:
  contents: read

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Self-checks
        run: pnpm run check

  # Build and test the Rust backend on the primary target platform.
  rust-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Mirrors the list in release.yml's Linux build. If one changes, change both.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            libasound2-dev \
            libdbus-1-dev \
            cmake

      # `--locked` because a Cargo.toml change that forgets its Cargo.lock is the other way this
      # goes wrong quietly.
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
